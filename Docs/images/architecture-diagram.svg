<svg viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#586069"/>
    </marker>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- Left: flash map -->
  <text x="40" y="34" font-size="15" font-weight="700" fill="#24292f">STM32F401CCU6 internal flash (256 KB, not to scale)</text>

  <rect x="40" y="55" width="330" height="48" rx="6" fill="#e9f7ef" stroke="#2f9e5b" stroke-width="1.5"/>
  <text x="205" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#1d6b3d">Bootloader (this repo) — sector 0</text>
  <text x="205" y="93" text-anchor="middle" font-size="11" fill="#2f7d4f">0x08000000 · 16 KB · uses 8,664 B</text>

  <rect x="40" y="103" width="330" height="140" rx="6" fill="#e7f1ff" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="205" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1b3a63">Application — sectors 1–4</text>
  <text x="205" y="169" text-anchor="middle" font-size="11" fill="#3a5c85">0x08004000 · 112 KB</text>
  <text x="205" y="187" text-anchor="middle" font-size="11" fill="#3a5c85">the running image (The Living Toy)</text>

  <rect x="40" y="243" width="330" height="150" rx="6" fill="#fff4e5" stroke="#e1922f" stroke-width="1.5"/>
  <text x="205" y="286" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4a0c">Staging — sector 5</text>
  <text x="205" y="305" text-anchor="middle" font-size="11" fill="#8a5e1f">0x08020000 · 128 KB</text>
  <text x="205" y="323" text-anchor="middle" font-size="11" fill="#8a5e1f">written by the app's FOTA receiver</text>
  <rect x="52" y="352" width="306" height="30" rx="4" fill="#ffe3b8" stroke="#e1922f" stroke-width="1"/>
  <text x="205" y="371" text-anchor="middle" font-size="11" fill="#7a4a0c">32-byte trailer at the end — magic word written last</text>

  <text x="40" y="425" font-size="11" fill="#586069">Only sectors 1–5 are inside the flash driver's writable window:</text>
  <text x="40" y="441" font-size="11" fill="#586069">the bootloader cannot erase or program itself.</text>

  <!-- Right: boot flow -->
  <text x="450" y="34" font-size="15" font-weight="700" fill="#24292f">Every reset</text>

  <rect x="450" y="55" width="500" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="700" y="82" text-anchor="middle" font-size="12" fill="#24292f">1  Reset → bootloader runs from sector 0 (16 MHz HSI, no interrupts)</text>
  <line x1="700" y1="99" x2="700" y2="119" stroke="#586069" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="450" y="119" width="500" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="700" y="146" text-anchor="middle" font-size="12" fill="#24292f">2  Magic word at the staging trailer?  No → check app vectors → jump</text>
  <line x1="700" y1="163" x2="700" y2="183" stroke="#586069" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="450" y="183" width="500" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="700" y="207" text-anchor="middle" font-size="12" fill="#24292f">3  Yes → trailer CRC, version, length, whole-image CRC,</text>
  <text x="700" y="225" text-anchor="middle" font-size="12" fill="#24292f">staged stack pointer and reset vector — all before touching the app</text>
  <line x1="700" y1="241" x2="700" y2="261" stroke="#586069" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="450" y="261" width="500" height="44" rx="6" fill="#fdecea" stroke="#d9534f"/>
  <text x="700" y="288" text-anchor="middle" font-size="12" fill="#7a1f1c">Any check fails → erase sector 5 → boot the old app untouched</text>
  <text x="700" y="323" text-anchor="middle" font-size="11" fill="#586069">all checks pass</text>
  <line x1="700" y1="305" x2="700" y2="331" stroke="#586069" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="450" y="331" width="500" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="700" y="358" text-anchor="middle" font-size="12" fill="#24292f">4  LED on → erase S1–S4 → program image → CRC the installed app</text>
  <line x1="700" y1="375" x2="700" y2="395" stroke="#586069" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="450" y="395" width="500" height="44" rx="6" fill="#e9f7ef" stroke="#2f9e5b"/>
  <text x="700" y="422" text-anchor="middle" font-size="12" fill="#1d6b3d">5  Erase sector 5 (the commit) → LED off → jump to the new app</text>
</svg>
